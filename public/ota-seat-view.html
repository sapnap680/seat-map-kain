<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12/12・12/13 大田区総合体育館 座席からの見え方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#18202c; --sub:#5b6676; --line:#d6dbe3;
  --accent:#1f59ac; --accent-ink:#ffffff; --chip:#f3f5f8; --chip-ink:#18202c; --off:#b9c0ca;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c; --panel:#171e29; --ink:#e8edf4; --sub:#9aa6b6; --line:#2b3544;
    --accent:#5b93e6; --accent-ink:#0f141c; --chip:#212a37; --chip-ink:#e8edf4; --off:#3a4452;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --panel:#171e29; --ink:#e8edf4; --sub:#9aa6b6; --line:#2b3544;
  --accent:#5b93e6; --accent-ink:#0f141c; --chip:#212a37; --chip-ink:#e8edf4; --off:#3a4452;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-weight:500}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.stage{position:relative;min-height:0;background:#2a2f37}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.seatcard{position:absolute;left:16px;bottom:16px;max-width:calc(100% - 32px);background:rgba(15,20,28,.8);color:#fff;border-radius:10px;padding:10px 14px;backdrop-filter:blur(6px)}
.seatcard b{display:block;font-size:1.25rem;font-weight:900}
.seatcard .sub{display:block;font-size:.78rem;opacity:.8;margin-top:2px}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 20px 28px}
h1{font-size:1.15rem;font-weight:900;margin:0 0 4px;line-height:1.4}
.lead{font-size:.82rem;color:var(--sub);margin:0 0 14px;line-height:1.6}
h2{font-size:.9rem;font-weight:700;margin:18px 0 8px}
.map{display:block;width:100%;max-width:360px;margin:0 auto;height:auto;touch-action:manipulation}
.map .hit{cursor:pointer;outline:none}
.map .hit .vis{fill:none;stroke:none}
.map .hit:hover .vis{fill:rgba(255,255,255,.25);stroke:#1f59ac;stroke-width:3}
.map .hit.on .vis{fill:rgba(255,242,0,.35);stroke:#e23b3b;stroke-width:6}
.map .hit:focus-visible .vis{stroke:#1f59ac;stroke-width:6;stroke-dasharray:10 6}
.map text{font-family:inherit;font-weight:900;pointer-events:none}
.maphelp{font-size:.75rem;color:var(--sub);margin:6px 0 0;text-align:center}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.sl{display:block;font-size:.85rem;margin:12px 0 4px}
label.sl output{float:right;color:var(--sub)}
input[type=range]{width:100%;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-top:12px}
.rows{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.rows button,.stepper button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:8px;cursor:pointer;padding:9px 0}
.rows button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.stepper output{font-weight:900;font-size:1.05rem;min-width:5.5em;text-align:center}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.overview{margin-top:18px;width:100%;font:inherit;font-weight:700;padding:10px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.78rem;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.note{font-size:.75rem;color:var(--sub);line-height:1.65;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto;min-height:100%}
  .panel{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="c" aria-label="1階席から見たアリーナの3D表示"></canvas>
    <div class="seatcard" id="seatcard"><b>全体</b><span class="sub">席を押すか、右の図からブロックを選ぶと、その席からの見え方に切り替わります</span></div>
  </div>
  <aside class="panel">
    <h1>12/12・12/13<br>大田区総合体育館</h1>
    <p class="lead">※見え方はあくまでイメージです。実際の見え方とは異なる場合があります。</p>

    <h2>席を選ぶ</h2>
    <svg class="map" id="map" viewBox="0 0 1080 1072" role="group" aria-label="会場図（席を押すと、その席からの見え方に切り替わります）"></svg>

    <div id="rowBox">
      <h2>列 <output id="rowOut"></output></h2>
      <div class="rows" id="rows" role="group" aria-label="列を選ぶ"></div>
    </div>
    <h2>席</h2>
    <div class="stepper">
      <button id="prev" aria-label="左となりの席">◀ 左の席</button>
      <output id="posOut"></output>
      <button id="next" aria-label="右となりの席">右の席 ▶</button>
    </div>


    <button class="overview" id="overview">全体を見る</button>

    <div class="legend" id="legend">
      <span><i style="background:#e48bb4"></i>1階指定席</span>
      <span><i style="background:#cc4d90"></i>1階指定席（ゴール裏）</span>
      <span><i style="background:#7030a0"></i>コートサイドA</span>
      <span><i style="background:#ccc2dd"></i>コートサイドB</span>
      <span><i style="background:#4f81bd"></i>コートエンド</span>
      <span><i style="background:#bf9000"></i>スペシャルシート</span>
      <span><i style="background:#92d050"></i>チーム券席</span>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x23272e);
const camera=new THREE.PerspectiveCamera(62,1,0.1,300);
scene.add(new THREE.HemisphereLight(0xfff8ee,0x4a4f58,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.45); sun.position.set(6,30,10); scene.add(sun);

// ---------- 寸法（m）：x＝横（右がベンチ側）、z＝縦（上が K・L・M 側）、y＝高さ ----------
const HX=19, HZ=24;            // 床 38m×48m の半分
const SL=7.5, BL=14;           // サイドライン・エンドライン（コート15m×28m）
const FS=3.6, FE=3.0;          // ライン→1階スタンド最前列（写真からの推定）
const RD=0.8, RR=0.4;          // 1階スタンド：1列の奥行き・段差
const SW=0.45, AISLE=1.0;      // 1席の幅・通路

const mat=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,x,y,z,m,ry){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);if(ry)o.rotation.y=ry;scene.add(o);return o;}

// 床とコート
const floor=new THREE.Mesh(new THREE.PlaneGeometry(HX*2,HZ*2),mat(0xd8bb8a)); floor.rotation.x=-Math.PI/2; scene.add(floor);
(function(){
  const S=40,pad=2,cw=(15+pad*2)*S,cl=(28+pad*2)*S;
  const cv=document.createElement('canvas');cv.width=cw;cv.height=cl;const g=cv.getContext('2d');
  g.fillStyle='#e7cc9c';g.fillRect(0,0,cw,cl);
  g.strokeStyle='#ffffff';g.lineWidth=0.08*S;
  const ox=pad*S,oy=pad*S,W=15*S,L=28*S,cx=ox+W/2;
  g.strokeRect(ox,oy,W,L);
  g.beginPath();g.moveTo(ox,oy+L/2);g.lineTo(ox+W,oy+L/2);g.stroke();
  g.beginPath();g.arc(cx,oy+L/2,1.8*S,0,Math.PI*2);g.stroke();
  [[oy,1],[oy+L,-1]].forEach(([by,dir])=>{
    const ky=dir>0?by:by-5.8*S;
    g.strokeRect(cx-2.45*S,ky,4.9*S,5.8*S);
    g.beginPath();g.arc(cx,by+dir*5.8*S,1.8*S,dir>0?0:Math.PI,dir>0?Math.PI:Math.PI*2);g.stroke();
    const hy=by+dir*1.575*S,r=6.75*S,side=6.6*S,a=Math.asin(side/r);
    g.beginPath();g.moveTo(cx-side,by);g.lineTo(cx-side,hy+dir*Math.cos(a)*r);
    if(dir>0)g.arc(cx,hy,r,Math.PI-(Math.PI/2-a),Math.PI/2-a,true);else g.arc(cx,hy,r,Math.PI+(Math.PI/2-a),-(Math.PI/2-a),false);
    g.lineTo(cx+side,by);g.stroke();
  });
  const tex=new THREE.CanvasTexture(cv);tex.anisotropy=8;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(15+pad*2,28+pad*2),new THREE.MeshLambertMaterial({map:tex}));
  m.rotation.x=-Math.PI/2;m.position.y=0.01;scene.add(m);
})();

// ゴール（赤い支柱）
function hoop(dir){
  const red=mat(0xc8322b), white=mat(0xf2f2f2);
  box(1.0,0.5,1.6,0,0.25,dir*(BL+1.6),red);
  box(0.25,3.2,0.25,0,1.85,dir*(BL+1.4),red);
  const arm=box(0.18,0.18,1.9,0,3.3,dir*(BL+0.25),white); arm.rotation.x=dir*0.35;
  box(1.8,1.05,0.05,0,3.45,dir*(BL-1.2),new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:0.8}));
  const rim=new THREE.Mesh(new THREE.TorusGeometry(0.23,0.02,8,24),mat(0xe0612b));rim.rotation.x=Math.PI/2;rim.position.set(0,3.05,dir*(BL-1.575));scene.add(rim);
}
hoop(-1);hoop(1);

// ベンチ側（右）：TO・チームベンチ
const dark=mat(0x2f343c);
box(0.8,0.85,4.4,SL+2.0,0.43,0,dark);
[-1,1].forEach(d=>{ for(let i=0;i<12;i++) box(0.5,0.45,0.5,SL+2.2,0.23,d*(5.6+i*0.62),mat(0x3d4652)); });

// 中央の吊り下げスコアボード・屋根のトラス
box(4,3.2,4,0,15.5,0,mat(0x15181d));
const truss=mat(0x3c4048);
for(let i=0;i<8;i++){ const a=i*Math.PI/8; box(0.35,0.5,52,0,19.5,0,truss,a); }
// 部屋（壁・天井）
const room=new THREE.Mesh(new THREE.BoxGeometry(78,22,90),new THREE.MeshLambertMaterial({color:0x8f7f68,side:THREE.BackSide}));room.position.y=11;scene.add(room);
box(78,0.2,90,0,21.9,0,mat(0x22252b));

// ---------- 座席 ----------
const seats=[];  // 選べる席 {p,face,block,cat,row,num,label}
const COL={pink:0xe48bb4,goal:0xcc4d90,csA:0x7030a0,csB:0xccc2dd,ce:0x4f81bd,sp:0xbf9000,team:0x92d050,wood:0xd9b27a};
const treadM=mat(0xc49a63), aisleM=mat(0xe2c793), holeM=mat(0x121418);
// 看板（入口の表示）
function sign(text,x,y,z){
  const cv=document.createElement('canvas');cv.width=256;cv.height=96;const g=cv.getContext('2d');
  g.fillStyle='#1f59ac';g.fillRect(0,0,256,96);g.fillStyle='#fff';g.font='bold 52px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,128,50);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv)}));sp.scale.set(2.2,0.82,1);sp.position.set(x,y,z);scene.add(sp);
}
// 直線のひな壇：side 'L','R'（長辺）/'T','B'（端）。rows=[{d,y}]、u0..u1 の範囲に段を作る（gaps は段を抜く範囲）
function treads(side,rows,u0,u1,gaps){
  rows.forEach((r,k)=>{
    const depth=r.dep||0.85;
    let segs=[[u0,u1]];
    (gaps||[]).forEach(([a,b,ks])=>{ if(ks&&!ks.includes(k)) return; segs=segs.flatMap(([c,d])=>(b<=c||a>=d)?[[c,d]]:[[c,a],[b,d]].filter(([e,f])=>f-e>0.05)); });
    segs.forEach(([a,b])=>{
      const len=b-a, mid=(a+b)/2, h=Math.max(r.y,0.02);
      if(side==='L') box(depth,h,len,-r.d,h/2,mid,treadM);
      if(side==='R') box(depth,h,len,r.d,h/2,mid,treadM);
      if(side==='T') box(len,h,depth,mid,h/2,-r.d,treadM);
      if(side==='B') box(len,h,depth,mid,h/2,r.d,treadM);
    });
  });
}
// 通路（階段）の色を少し明るく
function aisleStrip(side,rows,u,w){
  rows.forEach(r=>{ const dep=r.dep||0.85;
    if(side==='L') box(dep,0.03,w,-r.d,r.y+0.015,u,aisleM);
    if(side==='R') box(dep,0.03,w,r.d,r.y+0.015,u,aisleM);
    if(side==='T') box(w,0.03,dep,u,r.y+0.015,-r.d,aisleM);
    if(side==='B') box(w,0.03,dep,u,r.y+0.015,r.d,aisleM);
  });
}
function place(side,d,u){ if(side==='L')return [-d,u,Math.PI/2]; if(side==='R')return [d,u,-Math.PI/2]; if(side==='T')return [u,-d,0]; return [u,d,Math.PI]; }

// ===== 1階（可動席・7列）=====
const AISLES={};
const rows1=[...Array(7)].map((_,i)=>({y:i*RR,dep:RD}));
function stand1F(side,blocks,cat,color,numbering,skip,gaps){
  const front=(side==='L'||side==='R')?SL+FS:BL+FE;
  rows1.forEach((r,i)=>r.d=front+i*RD+RD/2);
  const R=rows1.map(r=>({...r}));
  const total=blocks.reduce((s,b)=>s+b[1],0)*SW+(blocks.length-1)*AISLE;
  treads(side,R,-total/2,total/2,gaps);
  let t=-total/2; const aisles=[];
  blocks.forEach(([name,n],bi)=>{
    R.forEach((r,ri)=>{ for(let i=0;i<n;i++){
      if(skip&&skip(name,i,n)) continue;
      const [x,z,face]=place(side,r.d,t+SW/2+i*SW);
      seats.push({p:new THREE.Vector3(x,r.y,z),face,block:name,cat,row:ri+1,num:numbering(i,n),color,selectable:cat!=='チーム券席'});
    }});
    t+=n*SW; if(bi<blocks.length-1){ aisleStrip(side,R,t+AISLE/2,AISLE); aisles.push(t+AISLE/2); t+=AISLE; }
  });
  AISLES[side]=aisles;
  return {total,back:front+7*RD};
}
stand1F('L',[['I',3],['H',17],['G',17],['F',17],['E',3]],'1階指定席',COL.pink,(i,n)=>i+1);
stand1F('T',[['K',12],['L',17],['M',12]],'1階指定席（ゴール裏）',COL.goal,(i,n)=>n-i);
stand1F('B',[['C',12],['B',17],['A',12]],'1階指定席（ゴール裏）',COL.goal,(i,n)=>i+1);
// ベンチ側：真ん中（Qの5〜13番の位置）は選手の入口
const qGap=[-2.03,2.03];
stand1F('R',[['O',13],['P',17],['Q',17],['R',17],['S',13]],'チーム券席',COL.team,(i,n)=>i+1,(name,i)=>name==='Q'&&i>=4&&i<13,[[qGap[0],qGap[1]]]);
// 真ん中は床の高さの通路。奥（1階スタンドのいちばん後ろの下）に出入口がある
(function(){
  const w=qGap[1]-qGap[0], x0=SL+FS, x1=SL+FS+7*RD, side=mat(0x8a6c48);
  [-1,1].forEach(sg=>{ for(let r=0;r<7;r++){ const h=r*RR+0.5; box(RD,h,0.12,x0+r*RD+RD/2,h/2,sg*(qGap[1]+0.06),side); } });
  const H=6*RR+0.6;
  box(0.3,H,w+0.24,x1+0.15,H/2,0,mat(0x6b5a45));      // 奥の壁
  box(0.12,2.2,2.4,x1-0.02,1.1,0,holeM);              // 出入口（床の高さ）
})();

// ===== 2階・3階（常設席）：1階の後ろからそのまま続く =====
const D0s=SL+FS+7*RD+0.9, D0e=BL+FE+7*RD+0.9, Y0=6*RR+0.45;
const row2=(k,D0)=>({d:D0+k*0.85+(k>=4?1.2:0), y:Y0+k*0.45+(k>=4?0.45:0)});
// 1階と2階のあいだの段（つながっている）
[['L',D0s],['R',D0s]].forEach(([sd,D])=>treads(sd,[{d:D-0.45,y:6*RR+0.2,dep:0.9}],-20.5,20.5));
[['T',D0e],['B',D0e]].forEach(([sd,D])=>treads(sd,[{d:D-0.45,y:6*RR+0.2,dep:0.9}],-17,17));
// 柵：1階の最後列のすぐ後ろ。ブロックの間の通路のところだけ開いていて、2階へ上がれる
const fenceM=mat(0xf1f1ef);
function fence(side,D,u0,u1,openings){
  let segs=[[u0,u1]];
  openings.forEach(o=>{ const [lo,hi]=Array.isArray(o)?o:[o-0.55,o+0.55]; segs=segs.flatMap(([a,b])=>(hi<=a||lo>=b)?[[a,b]]:[[a,lo],[hi,b]].filter(([c,d])=>d-c>0.05)); });
  const y0=6*RR, h=1.0;
  segs.forEach(([a,b])=>{ const len=b-a, mid=(a+b)/2;
    if(side==='L') box(0.08,h,len,-D,y0+h/2,mid,fenceM);
    if(side==='R') box(0.08,h,len,D,y0+h/2,mid,fenceM);
    if(side==='T') box(len,h,0.08,mid,y0+h/2,-D,fenceM);
    if(side==='B') box(len,h,0.08,mid,y0+h/2,D,fenceM);
  });
}
fence('L',D0s-0.9,-20.5,20.5,AISLES.L);
fence('R',D0s-0.9,-20.5,20.5,[...AISLES.R]);
fence('T',D0e-0.9,-17,17,AISLES.T);
fence('B',D0e-0.9,-17,17,AISLES.B);
const seats2=[];
const ENT=3.0;   // 2階と3階の間の通路にある入口の幅
function straight2(side,blocks,nRows,entrances,D0){
  const total=blocks.reduce((s,b)=>s+b[1],0)*0.5+(blocks.length-1)*1.0;
  const R=[...Array(nRows)].map((_,k)=>row2(k,D0));
  const gaps=entrances.map(u=>[u-ENT/2,u+ENT/2,[4,5,6,7]]);
  treads(side,R,-total/2,total/2,gaps);
  // 2階と3階の間の横の通路
  if(nRows>4){ const a=R[3], b=R[4], w=b.d-a.d-0.85; treads(side,[{d:a.d+0.425+w/2,y:a.y+0.05,dep:w}],-total/2,total/2); }
  let t=-total/2;
  blocks.forEach(([name,n],bi)=>{
    R.forEach((r,k)=>{ for(let i=0;i<n;i++){ const u=t+0.25+i*0.5;
      if(k>=4&&k<=7&&entrances.some(e=>Math.abs(u-e)<ENT/2)) continue;
      const [x,z,f]=place(side,r.d,u); seats2.push([x,r.y,z,f,k<4]); }});
    t+=n*0.5; if(bi<blocks.length-1){ aisleStrip(side,R,t+0.5,1.0); t+=1.0; }
  });
  return total;
}
// 長辺の入口：左は I・G・E、右は O・Q・S の真ん中
function centers(blocks,picks){ const total=blocks.reduce((s,b)=>s+b[1],0)*0.5+(blocks.length-1)*1.0; let t=-total/2; const out=[];
  blocks.forEach(([name,n])=>{ if(picks.includes(name)) out.push(t+n*0.25); t+=n*0.5+1.0; }); return out; }

function paint(){

  [[benchInst,benches],[chairInst,chairs]].forEach(([m,list])=>{

}

const state={mode:'overview',block:null,seat:null,yaw:0,pitch:0,th:0.75,ph:1.05,R:34};
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const look=new THREE.Vector3(), center=new THREE.Vector3(0,1.2,0);
let anim=null;
function goal(){
  if(state.mode==='overview'){
    // 屋根のトラス（高さ約19m）より下、壁の内側に収める
    const R=state.R, ph=state.ph, th=state.th;
    let y=R*Math.cos(ph), hr=R*Math.sin(ph);
    const sx=Math.abs(Math.sin(th))||1e-6, sz=Math.abs(Math.cos(th))||1e-6;
    hr=Math.min(hr,34/sx,40/sz); y=Math.min(y,16);
    return {pos:new THREE.Vector3(hr*Math.sin(th),y,hr*Math.cos(th)),look:new THREE.Vector3(0,0,0)};
  }
  const s=state.seat, eye=s.p.clone().add(new THREE.Vector3(0,s.chair?1.15:1.2,0));
  const v=new THREE.Vector3().subVectors(center,eye);
  const yaw=Math.atan2(v.x,v.z)+state.yaw, pitch=Math.max(-1.2,Math.min(0.7,Math.atan2(v.y,Math.hypot(v.x,v.z))+state.pitch));
  return {pos:eye,look:eye.clone().add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)))};
}
function move(instant){
  const g=goal();
  if(instant||reduce){camera.position.copy(g.pos);look.copy(g.look);camera.lookAt(look);anim=null;return;}
  anim={t0:performance.now(),from:camera.position.clone(),fl:look.clone(),to:g.pos,tl:g.look};
}
let drag=null, down=null;
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};down={x:e.clientX,y:e.clientY,t:performance.now()};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};
  if(state.mode==='overview'){state.th-=dx*0.006;state.ph=Math.max(0.55,Math.min(1.45,state.ph+dy*0.006));}
  else{state.yaw-=dx*0.004;state.pitch-=dy*0.004;}
  move(true);
});
canvas.addEventListener('pointerup',e=>{
  drag=null;
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y), quick=performance.now()-down.t<500; down=null;
  if(moved>6||!quick) return;
  const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects([benchInst,chairInst]);
  for(const h of hits){ const s=(h.object===benchInst?benches:chairs)[h.instanceId]; if(s&&s.selectable){ chooseSeat(s); return; } }
});
canvas.addEventListener('wheel',e=>{if(state.mode!=='overview')return;e.preventDefault();state.R=Math.max(14,Math.min(42,state.R*(1+e.deltaY*0.001)));move(true);},{passive:false});

  rects.forEach(([x,y,w,h])=>{
    el('rect',{x:x-pl,y:y-pt,width:w+pl+pr,height:h+pt+pb,fill:'#000','fill-opacity':0},g);
    el('rect',{class:'vis',x,y,width:w,height:h,rx:2},g);
  });
  g.addEventListener('click',()=>selectBlock(key));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectBlock(key);}});
  btns[key]=g;
});
function markBlock(k){ Object.entries(btns).forEach(([key,g])=>{ g.classList.toggle('on',key===k); g.setAttribute('aria-pressed',String(key===k)); }); }
function mapSale(){ /* 会場図はもともと販売しない席が灰色 */ }

function list(){ return seats.filter(s=>s.block===state.block&&s.selectable); }
function selectBlock(b){
  state.block=b; markBlock(b);
  const L=list(), rows=[...new Set(L.map(s=>s.row))];
  rowEl.disabled=rows.length<=1; if(rowEl.disabled) rowEl.value=1;
  pick();
}
function pick(){
  let L=list(); if(!L.length) return;
  const isStand=L[0].row>0;
  if(isStand) L=L.filter(s=>s.row===+rowEl.value);
  // 左右の並び：ブロックの中心から見た接線方向
  const c=L.reduce((v,s)=>v.add(s.p),new THREE.Vector3()).multiplyScalar(1/L.length);
  const t=new THREE.Vector3(c.z,0,-c.x).normalize();
  if(isStand) L.sort((a,b)=>a.p.dot(t)-b.p.dot(t)); else L.sort((a,b)=>a.num-b.num);
  showSeat(L[Math.round(+posEl.value/100*(L.length-1))]);
}
function rowList(s){
  let L=seats.filter(x=>x.block===s.block&&x.selectable&&x.row===s.row);
  if(s.row>0){ const c=L.reduce((v,x)=>v.add(x.p),new THREE.Vector3()).multiplyScalar(1/L.length), t=new THREE.Vector3(c.z,0,-c.x).normalize(); L.sort((a,b)=>a.p.dot(t)-b.p.dot(t)); }
  else L.sort((a,b)=>a.num-b.num);
  return L;
}
function chooseSeat(s){
  state.block=s.block; markBlock(s.block);
  rowEl.disabled=s.row===0; if(s.row>0) rowEl.value=s.row;
  const L=rowList(s); posEl.value=L.length>1?Math.round(L.indexOf(s)/(L.length-1)*100):50;
  showSeat(s);
}
function showSeat(s){
  const isStand=s.row>0;
  state.seat=s; state.mode='seat'; state.yaw=0; state.pitch=0; paint();
  rowOut.textContent=isStand?`（${s.row}列目）`:''; posOut.textContent=`${s.num}番`;
  document.getElementById('rowBox').style.display=isStand?'':'none';
  rowBtns.forEach((b,i)=>b.setAttribute('aria-pressed',String(isStand&&i+1===s.row)));
  { const L=rowList(s), i=L.indexOf(s); document.getElementById('prev').disabled=i<=0; document.getElementById('next').disabled=i>=L.length-1; }
  card.innerHTML='';
  const b=document.createElement('b'); b.textContent=isStand?`${s.cat}　${s.block}ブロック ${s.row}列 ${s.num}番`:`${s.cat}　${s.num}番`;
  card.append(b);
  if(s.unsold){
    const sub=document.createElement('span'); sub.className='sub';
    sub.textContent='12/12・13は販売しない席です';
    card.append(sub);
  }
  move(false);
}
// 列ボタン・左右の席ボタン
const rowsEl=document.getElementById('rows'), rowBtns=[];
for(let r=1;r<=7;r++){ const b=document.createElement('button'); b.textContent=r; b.setAttribute('aria-label',r+'列目'); b.setAttribute('aria-pressed','false');
  b.onclick=()=>{ rowEl.value=r; pick(); }; rowsEl.appendChild(b); rowBtns.push(b); }
function step(d){ if(!state.seat) return; const L=rowList(state.seat); const i=Math.max(0,Math.min(L.length-1,L.indexOf(state.seat)+d)); chooseSeat(L[i]); }
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('overview').onclick=()=>{state.mode='overview';card.innerHTML='<b>全体</b><span class="sub">席を押すか、右の図からブロックを選んでください</span>';move(false);};

// ---------- 描画 ----------
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight,pr=renderer.getPixelRatio();if(canvas.width!==Math.floor(w*pr)||canvas.height!==Math.floor(h*pr)){renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?75:62;camera.updateProjectionMatrix();}}
function loop(now){
  resize();
  if(anim){let t=Math.min(1,(now-anim.t0)/700);t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;camera.position.lerpVectors(anim.from,anim.to,t);look.lerpVectors(anim.fl,anim.tl,t);camera.lookAt(look);if(t>=1)anim=null;}
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
paint(); mapSale(); move(true); requestAnimationFrame(loop);
(function initFromQuery(){
  const p=new URLSearchParams(location.search);
  const b=p.get('block');
  if(b&&REG[b]){ selectBlock(b); return; }
  selectBlock('G');
})();
})();
</script>
