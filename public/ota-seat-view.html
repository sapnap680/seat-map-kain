<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>12/12・12/13 大田区総合体育館 座席からの見え方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#18202c; --sub:#5b6676; --line:#d6dbe3;
  --accent:#1f59ac; --accent-ink:#ffffff; --chip:#f3f5f8; --chip-ink:#18202c; --off:#b9c0ca;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c; --panel:#171e29; --ink:#e8edf4; --sub:#9aa6b6; --line:#2b3544;
    --accent:#5b93e6; --accent-ink:#0f141c; --chip:#212a37; --chip-ink:#e8edf4; --off:#3a4452;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --panel:#171e29; --ink:#e8edf4; --sub:#9aa6b6; --line:#2b3544;
  --accent:#5b93e6; --accent-ink:#0f141c; --chip:#212a37; --chip-ink:#e8edf4; --off:#3a4452;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-weight:500}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.stage{position:relative;min-height:0;background:#2a2f37}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.seatcard{position:absolute;left:16px;bottom:16px;max-width:calc(100% - 32px);background:rgba(15,20,28,.8);color:#fff;border-radius:10px;padding:10px 14px;backdrop-filter:blur(6px)}
.seatcard b{display:block;font-size:1.25rem;font-weight:900}
.seatcard .price{display:block;font-size:1.05rem;font-weight:900;margin-top:6px;letter-spacing:.02em}
.seatcard .sub{display:block;font-size:.78rem;opacity:.8;margin-top:2px}
.seatcard .bench-hint{display:block;font-size:.74rem;opacity:.72;margin-top:6px;line-height:1.45}
.stepper .chev{display:inline-block;width:.65em;font-size:1.1em;font-weight:900;line-height:1;opacity:.75;vertical-align:-1px}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 20px 28px}
h1{font-size:1.15rem;font-weight:900;margin:0 0 4px;line-height:1.4}
.lead{font-size:.82rem;color:var(--sub);margin:0 0 14px;line-height:1.6}
h2{font-size:.9rem;font-weight:700;margin:18px 0 8px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.sl{display:block;font-size:.85rem;margin:12px 0 4px}
label.sl output{float:right;color:var(--sub)}
input[type=range]{width:100%;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;margin-top:12px}
.rows{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.rows button,.stepper button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:8px;cursor:pointer;padding:9px 0}
.rows button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.stepper output{font-weight:900;font-size:1.05rem;min-width:5.5em;text-align:center}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.overview{margin-top:18px;width:100%;font:inherit;font-weight:700;padding:10px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.78rem;color:var(--sub);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.note{font-size:.75rem;color:var(--sub);line-height:1.65;margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:58vh auto;height:auto;min-height:100%}
  .panel{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="c" aria-label="1階席から見たアリーナの3D表示"></canvas>
    <div class="seatcard" id="seatcard"><b>全体</b><span class="sub">3D画面の席を押すか、右の列・番号で選ぶと、その席からの見え方に切り替わります</span></div>
  </div>
  <aside class="panel">
    <h1>12/12・12/13<br>大田区総合体育館</h1>
    <p class="lead">※見え方はあくまでイメージです。実際の見え方とは異なる場合があります。</p>

    <div id="rowBox">
      <h2>列 <output id="rowOut"></output></h2>
      <div class="rows" id="rows" role="group" aria-label="列を選ぶ"></div>
    </div>
    <h2>席</h2>
    <div class="stepper">
      <button id="prev" aria-label="左となりの席"><span class="chev" aria-hidden="true">‹</span> 前の席</button>
      <output id="posOut"></output>
      <button id="next" aria-label="右となりの席">次の席 <span class="chev" aria-hidden="true">›</span></button>
    </div>

    <button class="overview" id="overview">全体を見る</button>

    <div class="legend" id="legend">
      <span><i style="background:#e48bb4"></i>1階指定席</span>
      <span><i style="background:#cc4d90"></i>1階指定席（ゴール裏）</span>
      <span><i style="background:#7030a0"></i>コートサイドA</span>
      <span><i style="background:#b07ee0"></i>コートサイドB</span>
      <span><i style="background:#4f81bd"></i>コートエンド</span>
      <span><i style="background:#bf9000"></i>スペシャルシート</span>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,logarithmicDepthBuffer:true});   // 遠くから見ても床とコートがチラつかないように
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x23272e);
const camera=new THREE.PerspectiveCamera(62,1,0.2,200);
scene.add(new THREE.HemisphereLight(0xfff8ee,0x4a4f58,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.45); sun.position.set(6,30,10); scene.add(sun);

// ---------- 寸法（m）：x＝横（右がベンチ側）、z＝縦（上が K・L・M 側）、y＝高さ ----------
const HX=19, HZ=24;            // 床 38m×48m の半分
const SL=7.5, BL=14;           // サイドライン・エンドライン（コート15m×28m）
const FS=3.6, FE=3.0;          // ライン→1階スタンド最前列（写真からの推定）
const RD=0.8, RR=0.4;          // 1階スタンド：1列の奥行き・段差
const SW=0.45, AISLE=1.0;      // 1席の幅・通路
const PLATFORM=0.52;           // 1階席床（コート面 y=0 より上・通路だけ階段で繋ぐ）

const mat=c=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,x,y,z,m,ry){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);if(ry)o.rotation.y=ry;scene.add(o);return o;}

// 床とコート
const floor=new THREE.Mesh(new THREE.PlaneGeometry(HX*2,HZ*2),mat(0xd8bb8a)); floor.rotation.x=-Math.PI/2; scene.add(floor);
(function(){
  const S=40,pad=2,cw=(15+pad*2)*S,cl=(28+pad*2)*S;
  const cv=document.createElement('canvas');cv.width=cw;cv.height=cl;const g=cv.getContext('2d');
  g.fillStyle='#e7cc9c';g.fillRect(0,0,cw,cl);
  g.strokeStyle='#ffffff';g.lineWidth=0.08*S;
  const ox=pad*S,oy=pad*S,W=15*S,L=28*S,cx=ox+W/2;
  g.strokeRect(ox,oy,W,L);
  g.beginPath();g.moveTo(ox,oy+L/2);g.lineTo(ox+W,oy+L/2);g.stroke();
  g.beginPath();g.arc(cx,oy+L/2,1.8*S,0,Math.PI*2);g.stroke();
  [[oy,1],[oy+L,-1]].forEach(([by,dir])=>{
    const ky=dir>0?by:by-5.8*S;
    g.strokeRect(cx-2.45*S,ky,4.9*S,5.8*S);
    g.beginPath();g.arc(cx,by+dir*5.8*S,1.8*S,dir>0?0:Math.PI,dir>0?Math.PI:Math.PI*2);g.stroke();
    const hy=by+dir*1.575*S,r=6.75*S,side=6.6*S,a=Math.asin(side/r);
    g.beginPath();g.moveTo(cx-side,by);g.lineTo(cx-side,hy+dir*Math.cos(a)*r);
    if(dir>0)g.arc(cx,hy,r,Math.PI-(Math.PI/2-a),Math.PI/2-a,true);else g.arc(cx,hy,r,Math.PI+(Math.PI/2-a),-(Math.PI/2-a),false);
    g.lineTo(cx+side,by);g.stroke();
  });
  const tex=new THREE.CanvasTexture(cv);tex.anisotropy=8;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(15+pad*2,28+pad*2),new THREE.MeshLambertMaterial({map:tex,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-4}));
  m.rotation.x=-Math.PI/2;m.position.y=0.015;scene.add(m);
})();

// ゴール（赤パッド＋白い斜めスタンド。大田アリーナに近い形）
function hoop(dir){
  const red=mat(0xcf2a28), redDk=mat(0xa82220), white=mat(0xeeeeee);
  const glass=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:0.72});
  const zPad=dir*(BL+0.95);
  box(1.55,1.05,1.85,0,0.525,zPad,red);
  box(1.5,0.14,0.1,0,0.07,zPad-dir*0.88,redDk);
  box(1.2,0.22,0.55,0,1.08,zPad-dir*0.42,white);
  const y0=1.05, z0=zPad-dir*0.55;
  const y1=3.5, z1=dir*(BL-1.08);
  const dy=y1-y0, dz=z1-z0, len=Math.hypot(dy,dz);
  const main=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.46,len),white);
  main.position.set(0,(y0+y1)/2,(z0+z1)/2);
  main.rotation.x=-Math.atan2(dy,dz);
  scene.add(main);
  const braceLen=len*0.55;
  const br=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.24,braceLen),white);
  br.position.set(0.22,(y0+y1)/2-0.15,(z0+z1)/2+dir*0.12);
  br.rotation.x=main.rotation.x*0.92;
  br.rotation.z=0.08;
  scene.add(br);
  box(0.38,0.32,0.38,0,y0+0.12,z0,white);
  box(2.15,1.18,0.16,0,y1,z1-dir*0.06,white);
  box(1.9,1.0,0.03,0,y1,z1-dir*0.14,glass);
  box(2.22,1.24,0.04,0,y1,z1-dir*0.02,white);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(0.23,0.075,14,36),mat(0xe0612b));
  rim.rotation.x=Math.PI/2;rim.position.set(0,3.08,dir*(BL-1.575));scene.add(rim);
}
hoop(-1);hoop(1);

// ベンチ側（右）：TO・チームベンチ（K・L・M側＝濃色 / A・B・C側＝淡色）
const TO=mat(0x2f343c);
box(0.8,0.85,4.4,SL+2.0,0.43,0,TO);
const BENCH_TONE={
  light:{zSign:1,chair:0xd9d5cc,apron:0xddd6c8,mark:'淡色'},
  dark:{zSign:-1,chair:0x3d4652,apron:0x2a2e36,mark:'濃色'}
};
function floorMark(text,x,z,ry){
  const cv=document.createElement('canvas');cv.width=192;cv.height=64;
  const g=cv.getContext('2d');
  g.clearRect(0,0,192,64);
  g.fillStyle='rgba(255,255,255,.78)';g.font='600 36px "Zen Kaku Gothic New",sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillText(text,96,34);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(2.6,0.85),new THREE.MeshLambertMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.rotation.z=ry||0;m.position.set(x,0.022,z);scene.add(m);
}
function benchSign(text,tone,x,z){
  const cv=document.createElement('canvas');cv.width=512;cv.height=160;const g=cv.getContext('2d');
  const dark=tone==='dark';
  g.fillStyle=dark?'#2a2f37':'#f3eee4'; g.strokeStyle=dark?'#ffffff':'#2a2f37'; g.lineWidth=10;
  g.beginPath(); g.roundRect?g.roundRect(8,8,496,144,28):g.rect(8,8,496,144); g.fill(); g.stroke();
  g.fillStyle=dark?'#ffffff':'#2a2f37'; g.font='900 92px "Zen Kaku Gothic New","Hiragino Sans",sans-serif';
  g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,256,86);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));
  sp.scale.set(3.2,1.0,1); sp.position.set(x,2.4,z); sp.renderOrder=10; scene.add(sp);
}
function benchApron(tone,zSign){
  const t=BENCH_TONE[tone], zMid=zSign*9.2;
  for(let i=0;i<12;i++) box(0.5,0.45,0.5,SL+2.2,0.23,zSign*(5.6+i*0.62),mat(t.chair));
  benchSign(t.mark+'ベンチ',tone,SL+2.2,zSign*9.0);
}
benchApron('light',1);
benchApron('dark',-1);

// 中央の吊り下げスコアボード・屋根のトラス
box(4,3.2,4,0,15.5,0,mat(0x15181d));
const truss=mat(0x3c4048);
for(let i=0;i<8;i++){ const a=i*Math.PI/8; box(0.35,0.5,52,0,19.5,0,truss,a); }
// 部屋（壁・天井）
const room=new THREE.Mesh(new THREE.BoxGeometry(78,22,90),new THREE.MeshLambertMaterial({color:0x8f7f68,side:THREE.BackSide}));room.position.y=11-0.3;scene.add(room);   // 部屋の底を床より30cm下げ、床と同じ高さで重ならないように
box(78,0.2,90,0,21.9,0,mat(0x22252b));

// ---------- 座席 ----------
const seats=[];  // 選べる席 {p,face,block,cat,row,num,label}
const COL={pink:0xe48bb4,goal:0xcc4d90,csA:0x7030a0,csB:0xb07ee0,ce:0x4f81bd,sp:0xbf9000,team:0x92d050,wood:0xd9b27a};
const treadM=mat(0xc49a63), aisleM=mat(0xe2c793), holeM=mat(0x121418);
const stepM=mat(0x6a5d52), platM=mat(0x7a6248);
const railM=mat(0x18181c);
const RAIL_PANEL_H=0.72;
// 直線のひな壇：side 'L','R'（長辺）/'T','B'（端）。rows=[{d,y}]、u0..u1 の範囲に段を作る（gaps は段を抜く範囲）
function treads(side,rows,u0,u1,gaps){
  rows.forEach((r,k)=>{
    const depth=r.dep||0.85;
    let segs=[[u0,u1]];
    (gaps||[]).forEach(([a,b,ks])=>{ if(ks&&!ks.includes(k)) return; segs=segs.flatMap(([c,d])=>(b<=c||a>=d)?[[c,d]]:[[c,a],[b,d]].filter(([e,f])=>f-e>0.05)); });
    segs.forEach(([a,b])=>{
      const len=b-a, mid=(a+b)/2, h=Math.max(r.y,0.02);
      if(side==='L') box(depth,h,len,-r.d,h/2,mid,treadM);
      if(side==='R') box(depth,h,len,r.d,h/2,mid,treadM);
      if(side==='T') box(len,h,depth,mid,h/2,-r.d,treadM);
      if(side==='B') box(len,h,depth,mid,h/2,r.d,treadM);
    });
  });
}
// 通路（階段）の色を少し明るく
function aisleStrip(side,rows,u,w){
  rows.forEach(r=>{ const dep=r.dep||0.85;
    if(side==='L') box(dep,0.03,w,-r.d,r.y+0.015,u,aisleM);
    if(side==='R') box(dep,0.03,w,r.d,r.y+0.015,u,aisleM);
    if(side==='T') box(w,0.03,dep,u,r.y+0.015,-r.d,aisleM);
    if(side==='B') box(w,0.03,dep,u,r.y+0.015,r.d,aisleM);
  });
}
// 通路：各列の段の奥半分に中間の段（20cm）を置いて、40cmの段差を2段の階段にする
// （前は列の境目をまたぐ箱を置いていたため、段と重なって見えていた）
function aisleRiserFill1F(side,frontD,u,w){
  const m=aisleM;
  for(let ri=0;ri<6;ri++){
    const y0=PLATFORM+ri*RR, h=RR/2, yC=y0+h/2;
    const dep=RD/2, dC=frontD+ri*RD+RD*0.75;   // その列の段の奥半分
    if(side==='L') box(dep,h,w,-dC,yC,u,m);
    if(side==='R') box(dep,h,w,dC,yC,u,m);
    if(side==='T') box(w,h,dep,u,yC,-dC,m);
    if(side==='B') box(w,h,dep,u,yC,dC,m);
  }
}
function place(side,d,u){ if(side==='L')return [-d,u,Math.PI/2]; if(side==='R')return [d,u,-Math.PI/2]; if(side==='T')return [u,-d,0]; return [u,d,Math.PI]; }

// 黒パイプ手すりパネル（写真：逆U枠＋内側2本）
function railPost(side,d,u,y0,h,t){
  t=t??0.024;
  if(side==='L') box(t,h,t,-d,y0+h/2,u,railM);
  if(side==='R') box(t,h,t,d,y0+h/2,u,railM);
  if(side==='T') box(t,h,t,u,y0+h/2,-d,railM);
  if(side==='B') box(t,h,t,u,y0+h/2,d,railM);
}
function railTop(side,d,u0,u1,y,t){
  t=t??0.026;
  const len=Math.abs(u1-u0), mid=(u0+u1)/2;
  if(side==='L') box(t,t,len,-d,y,mid,railM);
  if(side==='R') box(t,t,len,d,y,mid,railM);
  if(side==='T') box(len,t,t,mid,y,-d,railM);
  if(side==='B') box(len,t,t,mid,y,d,railM);
}
function pipeRailPanel(side,d,uCenter,panelU,yFoot,h){
  const half=panelU*0.48, uL=uCenter-half, uR=uCenter+half;
  railPost(side,d,uL,yFoot,h);
  railPost(side,d,uR,yFoot,h);
  railTop(side,d,uL,uR,yFoot+h);
  railPost(side,d,uCenter-panelU*0.22,yFoot,h*0.92);
  railPost(side,d,uCenter+panelU*0.22,yFoot,h*0.92);
}
// 端柵（写真）：席列に垂直・各段の端で奥行き（d）方向にパネル
function railTopAlongD(side,u,dLo,dHi,y,t){
  t=t??0.026;
  const len=dHi-dLo, mid=(dLo+dHi)/2;
  if(side==='L') box(len,t,t,-mid,y,u,railM);
  if(side==='R') box(len,t,t,mid,y,u,railM);
  if(side==='T') box(t,t,len,u,y,-mid,railM);
  if(side==='B') box(t,t,len,u,y,mid,railM);
}
function pipeRailPanelAlongD(side,u,dCenter,panelD,yFoot,h){
  const half=panelD*0.48, dLo=dCenter-half, dHi=dCenter+half;
  railPost(side,dLo,u,yFoot,h);
  railPost(side,dHi,u,yFoot,h);
  railTopAlongD(side,u,dLo,dHi,yFoot+h);
  railPost(side,dCenter-panelD*0.22,u,yFoot,h*0.92);
  railPost(side,dCenter+panelD*0.22,u,yFoot,h*0.92);
}
const FRONT_PANELS8=new Set(['H','G','F']);
const FRONT_PANELS1=new Set(['I','E']);
function frontPanelCount(name,u0,u1){
  if(FRONT_PANELS8.has(name)) return 8;
  if(FRONT_PANELS1.has(name)) return 1;
  const len=u1-u0;
  return Math.max(2, Math.min(4, Math.round(len/0.85)));
}
function row1F(frontD,ri){ return {d:frontD+ri*RD+RD/2,y:PLATFORM+ri*RR}; }
function courtFenceBlocks1F(side,frontD,blockRanges){
  const r0=row1F(frontD,0);
  const dEdge=r0.d-RD*0.4;
  const yFoot=r0.y+0.02;
  const h=RAIL_PANEL_H, gap=0.06;

canvas.addEventListener('pointermove',e=>{
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};
  if(state.mode==='overview'){state.th-=dx*0.006;state.ph=Math.max(0.55,Math.min(1.45,state.ph+dy*0.006));}
  else{state.yaw-=dx*0.004;state.pitch-=dy*0.004;}
  move(true);
});
canvas.addEventListener('pointerup',e=>{
  drag=null;
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y), quick=performance.now()-down.t<500; down=null;
  if(moved>6||!quick) return;
  const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects([benchInst,chairInst]);
  for(const h of hits){ const s=(h.object===benchInst?benches:chairs)[h.instanceId]; if(s&&s.selectable){ chooseSeat(s); return; } }
});
canvas.addEventListener('wheel',e=>{if(state.mode!=='overview')return;e.preventDefault();state.R=Math.max(14,Math.min(42,state.R*(1+e.deltaY*0.001)));move(true);},{passive:false});

// ---------- パネル ----------
const rowEl={value:1,disabled:false}, posEl={value:50};
const rowOut=document.getElementById('rowOut'), posOut=document.getElementById('posOut'), card=document.getElementById('seatcard');
const btns={};
const hex=c=>'#'+c.toString(16).padStart(6,'0');
const REG={"I": [[193.0, 200.0, 69, 28]], "H": [[193.0, 246.0, 69, 169]], "G": [[193.0, 433.0, 69, 168]], "F": [[193.0, 619.0, 69, 169]], "E": [[193.0, 806.0, 69, 29]], "K": [[324.0, 62.0, 119, 69]], "L": [[461.0, 62.0, 169, 69]], "M": [[648.0, 62.0, 118, 69]], "C": [[324.0, 904.0, 119, 68]], "B": [[461.0, 904.0, 169, 68]], "A": [[648.0, 904.0, 118, 68]], "コートサイドA": [[374.0, 229.0, 14, 183], [374.0, 622.0, 14, 183]], "コートサイドB": [[355.0, 244.0, 14, 168], [355.0, 425.0, 14, 184], [355.0, 622.0, 14, 168]], "コートエンド": [[403.0, 223.0, 81, 18], [606.0, 223.0, 81, 18], [403.0, 794.0, 81, 18], [606.0, 794.0, 81, 18]], "スペシャルシート": [[710.0, 419.0, 14, 51], [710.0, 564.0, 14, 51]]};
function markBlock(k){ Object.entries(btns).forEach(([key,g])=>{ if(!g) return; g.classList.toggle('on',key===k); g.setAttribute('aria-pressed',String(key===k)); }); }
function mapSale(){ /* 会場図なし */ }
function list(){ return seats.filter(s=>s.block===state.block&&s.selectable); }
function selectBlock(b){
  if(NO_PICK.has(b)) return;
  state.block=b; markBlock(b);
  const L=list(), rows=[...new Set(L.map(s=>s.row))];
  rowEl.disabled=rows.length<=1; if(rowEl.disabled) rowEl.value=1;
  pick();
}
function pick(){
  let L=list(); if(!L.length) return;
  const isStand=L[0].row>0;
  if(isStand) L=L.filter(s=>s.row===+rowEl.value);
  // 左右の並び：ブロックの中心から見た接線方向
  const c=L.reduce((v,s)=>v.add(s.p),new THREE.Vector3()).multiplyScalar(1/L.length);
  const t=new THREE.Vector3(c.z,0,-c.x).normalize();
  if(isStand) L.sort((a,b)=>a.p.dot(t)-b.p.dot(t)); else L.sort((a,b)=>a.num-b.num);
  showSeat(L[Math.round(+posEl.value/100*(L.length-1))]);
}
function rowList(s){
  let L=seats.filter(x=>x.block===s.block&&x.selectable&&x.row===s.row);
  if(s.row>0){ const c=L.reduce((v,x)=>v.add(x.p),new THREE.Vector3()).multiplyScalar(1/L.length), t=new THREE.Vector3(c.z,0,-c.x).normalize(); L.sort((a,b)=>a.p.dot(t)-b.p.dot(t)); }
  else L.sort((a,b)=>a.num-b.num);
  return L;
}
function chooseSeat(s){
  state.block=s.block; markBlock(s.block);
  rowEl.disabled=s.row===0; if(s.row>0) rowEl.value=s.row;
  const L=rowList(s); posEl.value=L.length>1?Math.round(L.indexOf(s)/(L.length-1)*100):50;
  showSeat(s);
}
const TICKET_YEN={
  'スペシャルシート':10000,'コートエンド':8000,'コートサイドA':8000,'コートサイドB':6000,
  '1階指定席':5000,'1階指定席（ゴール裏）':4000
};
function ticketYen(s){
  if(s.cat&&s.cat.includes('ゴール裏')) return 4000;
  if(s.cat==='コートサイドB'||(s.cat&&s.cat.includes('コートサイドB'))) return 6000;
  return TICKET_YEN[s.cat]??null;
}
function benchHint(s){
  const label=s.p.z<0?'濃色（K・L・M側）':'淡色（A・B・C側）';
  if(s.p.x>=SL-0.5) return 'チームベンチ '+label;
  if(s.p.x<=-SL+0.5) return 'ベンチ反対側（向かい '+label+'）';
  return null;
}
function showSeat(s){
  const isStand=s.row>0;
  state.seat=s; state.mode='seat'; state.yaw=0; state.pitch=0; paint();
  rowOut.textContent=isStand?`（${s.row}列目）`:''; posOut.textContent=`${s.num}番`;
  document.getElementById('rowBox').style.display=isStand?'':'none';
  rowBtns.forEach((b,i)=>b.setAttribute('aria-pressed',String(isStand&&i+1===s.row)));
  { const L=rowList(s), i=L.indexOf(s); document.getElementById('prev').disabled=i<=0; document.getElementById('next').disabled=i>=L.length-1; }
  card.innerHTML='';
  const b=document.createElement('b'); b.textContent=isStand?`${s.cat}　${s.block}ブロック ${s.row}列 ${s.num}番`:`${s.cat}　${s.num}番`;
  card.append(b);
  const yen=ticketYen(s);
  if(yen!=null){
    const pr=document.createElement('span'); pr.className='price'; pr.textContent='¥'+yen.toLocaleString('ja-JP');
    card.append(pr);
  }
  const bh=benchHint(s);
  if(bh){
    const sp=document.createElement('span'); sp.className='bench-hint'; sp.textContent=bh;
    card.append(sp);
  }
  move(false);
}
// 列ボタン・左右の席ボタン
const rowsEl=document.getElementById('rows'), rowBtns=[];
for(let r=1;r<=7;r++){ const b=document.createElement('button'); b.textContent=r; b.setAttribute('aria-label',r+'列目'); b.setAttribute('aria-pressed','false');
  b.onclick=()=>{ rowEl.value=r; pick(); }; rowsEl.appendChild(b); rowBtns.push(b); }
function step(d){ if(!state.seat) return; const L=rowList(state.seat); const i=Math.max(0,Math.min(L.length-1,L.indexOf(state.seat)+d)); chooseSeat(L[i]); }
document.getElementById('prev').onclick=()=>step(-1);
document.getElementById('next').onclick=()=>step(1);
document.getElementById('overview').onclick=()=>{state.mode='overview';card.innerHTML='<b>全体</b><span class="sub">3D画面の席を押すか、右の列・番号で選んでください</span>';move(false);};

// ---------- 描画 ----------
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight,pr=renderer.getPixelRatio();if(canvas.width!==Math.floor(w*pr)||canvas.height!==Math.floor(h*pr)){renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?75:62;camera.updateProjectionMatrix();}}
function loop(now){
  resize();
  if(anim){let t=Math.min(1,(now-anim.t0)/700);t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;camera.position.lerpVectors(anim.from,anim.to,t);look.lerpVectors(anim.fl,anim.tl,t);camera.lookAt(look);if(t>=1)anim=null;}
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
paint(); mapSale(); move(true); requestAnimationFrame(loop);
(function initFromQuery(){
  const p=new URLSearchParams(location.search);
  const b=p.get('block');
  if(b&&REG[b]&&!NO_PICK.has(b)){ selectBlock(b); return; }
  selectBlock('G');
})();
})();
</script>
